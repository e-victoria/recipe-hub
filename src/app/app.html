<ng-container *transloco="let t">
  <header class="topbar">
    <a class="brand" routerLink="/">{{ t('app.name') }}</a>
    <label class="lang">
      <span class="visually-hidden">{{ t('app.language') }}</span>
      <select [value]="language.active" (change)="language.set($any($event.target).value)">
        @for (lang of languages; track lang) {
          <option [value]="lang" [selected]="lang === language.active">{{ labels[lang] }}</option>
        }
      </select>
    </label>
  </header>
  <main class="content">
    <router-outlet />
  </main>
</ng-container>
